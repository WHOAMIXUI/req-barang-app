            const syncToGoogleSheets = async (action, payload) => {
                if (!isSyncActive || !appsScriptUrl) return;

                    const response = await fetch(appsScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors', // Diperlukan untuk Google Apps Script Web App bypass CORS
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            action: action,
                            data: payload
                        })

                        const updated = [newReq, ...requests];
                        setRequests(updated);
                        localStorage.setItem('req_barang_data', JSON.stringify(updated));
                    }

                    // Sinkronisasi otomatis ke Google Sheets
                    await syncToGoogleSheets('CREATE', newReq);

                    setIsModalOpen(false);
                    showBannerNotification("Permintaan baru berhasil dikirim!");
                } catch (err) {
                    alert("Gagal mengirim data.");
                }
            };

            const handleUpdateStatus = async (requestId, newStatus, additionalNote = '') => {
                const target = requests.find(r => r.id === requestId);
                if (!target) return;

                const updatedHistory = [
                    ...(target.historyLog || []),
                    {
                        status: newStatus,
                        time: new Date().toISOString(),
                        note: additionalNote || `Status diperbarui menjadi ${newStatus}`,
                        by: `${userProfile.name} (${currentRole.toUpperCase()})`
                    }
                ];

                try {
                    if (db) {
                        const requestDoc = doc(db, 'requests', requestId);
                        await updateDoc(requestDoc, { status: newStatus, historyLog: updatedHistory });
                    } else {
                        const updated = requests.map(r => r.id === requestId ? { ...r, status: newStatus, historyLog: updatedHistory } : r);
                        setRequests(updated);
                        localStorage.setItem('req_barang_data', JSON.stringify(updated));
                    }

                    // Sinkronisasi otomatis ke Google Sheets
                    await syncToGoogleSheets('UPDATE', {
                        id: requestId,

                    });

                    if (selectedRequest && selectedRequest.id === requestId) {

                    }
                    showBannerNotification(`Status berhasil diperbarui menjadi ${newStatus}!`);
                } catch (e) {
                    alert("Gagal update status");
                }
            };

                        notes: notes,
                        historyLog: updatedHistory
                    });

                    if (selectedRequest && selectedRequest.id === requestId) {
                        setSelectedRequest(prev => ({ ...prev, harga: Number(harga), notes: notes, historyLog: updatedHistory }));

                    showBannerNotification("Rincian pengadaan berhasil diperbarui!");

                try {
                    if (db) {
                        await deleteDoc(doc(db, 'requests', requestId));
                    } else {
                        const updated = requests.filter(r => r.id !== requestId);
                        setRequests(updated);
                        localStorage.setItem('req_barang_data', JSON.stringify(updated));
                    }

                    await syncToGoogleSheets('DELETE', { id: requestId });

{`function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("REQUEST_DATA");
  if (!sheet) {
    sheet = SpreadsheetApp.getActiveSpreadsheet().insertSheet("REQUEST_DATA");
    sheet.appendRow(["ID", "Tgl Request", "Tgl Terakhir Pembelian", "Cabang/Store", "Pemohon/PIC", "Untuk Divisi", "Kategori", "Nama Barang", "Qty", "Alasan Urgensi", "Media", "Status", "Notes", "Whatsapp", "Harga"]);
  }
  
  var payload = JSON.parse(e.postData.contents);
  var action = payload.action;
  var data = payload.data;
  
  if (action === "CREATE") {
    sheet.appendRow([
      data.id || Utilities.getUuid(),
      data.tglRequest,
      data.tglTerakhirPembelian,
      data.cabang,
      data.pemohon,
      data.divisi,
      data.kategori,
      data.namaBarang,
      data.qty,
      data.alasanUrgensi,
      data.media,
      "Draft", // Status default pertama
      data.notes,
      data.whatsapp,
      data.harga
    ]);
  } else if (action === "UPDATE") {
    var range = sheet.getDataRange();
    var values = range.getValues();
    for (var i = 1; i < values.length; i++) {
      if (values[i][0] == data.id) {
        var row = i + 1;
        if (data.status) sheet.getRange(row, 12).setValue(data.status);
        if (data.harga) sheet.getRange(row, 15).setValue(data.harga);
        if (data.notes) sheet.getRange(row, 13).setValue(data.notes);
        break;
      }
    }
  } else if (action === "DELETE") {
    var range = sheet.getDataRange();
    var values = range.getValues();
    for (var i = 1; i < values.length; i++) {
      if (values[i][0] == data.id) {
        sheet.deleteRow(i + 1);
        break;
      }
    }
  }
  
  return ContentService.createTextOutput(JSON.stringify({status: "success"}))
    .setMimeType(ContentService.MimeType.JSON);
}`}

                    </div>
                </div>
            );
        }

        // Render aplikasi utama React
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
