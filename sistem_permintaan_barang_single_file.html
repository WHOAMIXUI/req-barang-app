<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReqBarang - Sistem Permintaan Barang Internal</title>
    
    <!-- Tailwind CSS untuk Styling Premium -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome untuk Icon Menarik -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React dan Babel CDN agar React bisa jalan langsung di HTML -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Membuka Akses ke Firebase SDK versi modern -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        // Membungkus SDK ke Window Object agar bisa dibaca oleh script Babel React
        window.FirebaseSDK = { initializeApp, getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc };
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100">

    <div id="root">
        <!-- Spinner Loading Awal Sebelum React Ter-render -->
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent mb-4"></div>
                <p class="text-slate-500 font-medium">Memuat Sistem ReqBarang...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        // Mengambil modul Firebase dari window object yang kita set di atas
        const { initializeApp, getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } = window.FirebaseSDK || {};

        // Konfigurasi Database Firebase Mock / Sandbox agar langsung aktif tanpa setup manual
        const firebaseConfig = {
            apiKey: "",
            authDomain: "mock-project.firebaseapp.com",
            projectId: "mock-project-reqbarang",
            storageBucket: "mock-project.appspot.com",
            messagingSenderId: "12345678",
            appId: "1:12345678:web:123"
        };

        // Inisialisasi Firebase
        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase gagal inisialisasi, mengaktifkan mode Local Storage sebagai cadangan.");
        }

        // Daftar Pilihan Role Akun untuk Simulasi
        const ROLES = {
            STAFF: { id: 'staff', name: 'Pemohon / Staff (PIC)', desc: 'Bisa membuat & melihat pengajuan sendiri' },
            MANAGER: { id: 'manager', name: 'Manager / Approver', desc: 'Bisa menyetujui / menolak pengajuan' },
            FINANCE: { id: 'finance', name: 'Finance / Purchasing', desc: 'Bisa input harga, update status, & kelola semua data' }
        };

        function App() {
            // States untuk manajemen mode tampilan, akun simulasi, dan notifikasi
            const [currentRole, setCurrentRole] = React.useState('staff');
            const [darkMode, setDarkMode] = React.useState(false);
            const [userProfile, setUserProfile] = React.useState({
                name: 'Budi Santoso',
                cabang: 'Jakarta Pusat',
                divisi: 'IT Support',
                whatsapp: '6281234567890'
            });

            // State untuk menampung data
            const [requests, setRequests] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [notification, setNotification] = React.useState(null);

            // Filter dan Pencarian
            const [searchTerm, setSearchTerm] = React.useState('');
            const [statusFilter, setStatusFilter] = React.useState('All');
            const [categoryFilter, setCategoryFilter] = React.useState('All');

            // Modal States
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [isDetailModalOpen, setIsDetailModalOpen] = React.useState(false);
            const [selectedRequest, setSelectedRequest] = React.useState(null);

            // State Form Permintaan Baru
            const [formData, setFormData] = React.useState({
                tglTerakhirPembelian: '',
                cabang: '',
                pemohon: '',
                divisi: '',
                kategori: 'IT/Elektronik',
                namaBarang: '',
                qty: 1,
                alasanUrgensi: 'Normal',
                media: 'Tokopedia',
                notes: '',
                whatsapp: '',
                harga: 0
            });

            // Sinkronkan form data dengan data profil pengguna aktif
            React.useEffect(() => {
                setFormData(prev => ({
                    ...prev,
                    pemohon: userProfile.name,
                    cabang: userProfile.cabang,
                    divisi: userProfile.divisi,
                    whatsapp: userProfile.whatsapp
                }));
            }, [userProfile]);

            // Ambil Data Secara Realtime dari Firebase Firestore (Atau fallback ke LocalStorage jika offline)
            React.useEffect(() => {
                if (db) {
                    const reqCollection = collection(db, 'requests');
                    const unsubscribe = onSnapshot(reqCollection, (snapshot) => {
                        const dataList = [];
                        snapshot.forEach((doc) => {
                            dataList.push({ id: doc.id, ...doc.data() });
                        });
                        // Urutkan berdasarkan tanggal request terbaru
                        dataList.sort((a, b) => new Date(b.tglRequest) - new Date(a.tglRequest));
                        setRequests(dataList);
                        setLoading(false);
                    }, (error) => {
                        console.error("Gagal konek Firebase, beralih ke penyimpanan lokal browser.");
                        loadBackupLocalData();
                    });
                    return () => unsubscribe();
                } else {
                    loadBackupLocalData();
                }
            }, []);

            // Mengisi data simulasi awal jika data kosong agar dashboard terlihat menarik
            const loadBackupLocalData = () => {
                const localData = localStorage.getItem('req_barang_data');
                if (localData) {
                    setRequests(JSON.parse(localData));
                } else {
                    const sampleData = [
                        {
                            id: 'sample-1',
                            tglRequest: '2026-07-06',
                            tglTerakhirPembelian: '2026-01-10',
                            cabang: 'Jakarta Pusat',
                            pemohon: 'Budi Santoso',
                            divisi: 'IT Support',
                            kategori: 'IT/Elektronik',
                            namaBarang: 'Keyboard Logitech K120',
                            qty: 3,
                            alasanUrgensi: 'Tinggi',
                            media: 'Tokopedia',
                            status: 'Pending',
                            notes: 'Keyboard divisi admin rusak 3 unit',
                            whatsapp: '6281234567890',
                            harga: 150000,
                            createdBy: 'simulasi-staff',
                            historyLog: [{ status: 'Pending', time: new Date().toISOString(), note: 'Permintaan dibuat', by: 'Budi Santoso' }]
                        },
                        {
                            id: 'sample-2',
                            tglRequest: '2026-07-05',
                            tglTerakhirPembelian: '',
                            cabang: 'Bandung',
                            pemohon: 'Siti Aminah',
                            divisi: 'Finance',
                            kategori: 'Alat Tulis Kantor',
                            namaBarang: 'Kertas A4 PaperOne 80gr',
                            qty: 10,
                            alasanUrgensi: 'Normal',
                            media: 'Offline Store',
                            status: 'Approved',
                            notes: 'Stok bulanan kantor cabang bandung',
                            whatsapp: '628987654321',
                            harga: 55000,
                            createdBy: 'simulasi-lain',
                            historyLog: [{ status: 'Approved', time: new Date().toISOString(), note: 'Disetujui manager', by: 'Andi (Manager)' }]
                        }
                    ];
                    localStorage.setItem('req_barang_data', JSON.stringify(sampleData));
                    setRequests(sampleData);
                }
                setLoading(false);
            };

            // Menampilkan Banner Notifikasi Melayang
            const showBannerNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3500);
            };

            // Input Handler
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: name === 'qty' || name === 'harga' ? Number(value) : value
                }));
            };

            const handleProfileChange = (e) => {
                const { name, value } = e.target;
                setUserProfile(prev => ({ ...prev, [name]: value }));
            };

            // Kirim Pengajuan Baru
            const handleSubmitRequest = async (e) => {
                e.preventDefault();
                const newReq = {
                    ...formData,
                    tglRequest: new Date().toISOString().split('T')[0],
                    status: 'Pending',
                    createdBy: 'simulasi-staff',
                    historyLog: [
                        {
                            status: 'Pending',
                            time: new Date().toISOString(),
                            note: 'Permintaan barang berhasil dibuat.',
                            by: userProfile.name
                        }
                    ]
                };

                try {
                    if (db) {
                        await addDoc(collection(db, 'requests'), newReq);
                    } else {
                        const updated = [newReq, ...requests];
                        setRequests(updated);
                        localStorage.setItem('req_barang_data', JSON.stringify(updated));
                    }
                    setIsModalOpen(false);
                    showBannerNotification("Permintaan baru berhasil dikirim!");
                } catch (err) {
                    alert("Gagal mengirim data.");
                }
            };

            // Ubah Status Pengajuan (Manager & Finance)
            const handleUpdateStatus = async (requestId, newStatus, additionalNote = '') => {
                const target = requests.find(r => r.id === requestId);
                if (!target) return;

                const updatedHistory = [
                    ...(target.historyLog || []),
                    {
                        status: newStatus,
                        time: new Date().toISOString(),
                        note: additionalNote || `Status diubah menjadi ${newStatus}`,
                        by: `${userProfile.name} (${currentRole.toUpperCase()})`
                    }
                ];

                try {
                    if (db) {
                        const requestDoc = doc(db, 'requests', requestId);
                        await updateDoc(requestDoc, { status: newStatus, historyLog: updatedHistory });
                    } else {
                        const updated = requests.map(r => r.id === requestId ? { ...r, status: newStatus, historyLog: updatedHistory } : r);
                        setRequests(updated);
                        localStorage.setItem('req_barang_data', JSON.stringify(updated));
                    }

                    if (selectedRequest && selectedRequest.id === requestId) {
                        setSelectedRequest(prev => ({ ...prev, status: newStatus, historyLog: updatedHistory }));
                    }
                    showBannerNotification(`Status berhasil diperbarui menjadi ${newStatus}!`);
                } catch (e) {
                    alert("Gagal update status");
                }
            };

            // Tambah Update Rincian Harga / Catatan Tambahan (Khusus Finance)
            const handleUpdateFinanceDetails = async (requestId, harga, notes) => {
                const target = requests.find(r => r.id === requestId);
                if (!target) return;

                const updatedHistory = [
                    ...(target.historyLog || []),
                    {
                        status: target.status,
                        time: new Date().toISOString(),
                        note: `Finance memperbarui estimasi harga menjadi Rp ${Number(harga).toLocaleString('id-ID')} dan menambahkan tautan pembelian.`,
                        by: `${userProfile.name} (FINANCE)`
                    }
                ];

                try {
                    if (db) {
                        const requestDoc = doc(db, 'requests', requestId);
                        await updateDoc(requestDoc, { harga: Number(harga), notes: notes, historyLog: updatedHistory });
                    } else {
                        const updated = requests.map(r => r.id === requestId ? { ...r, harga: Number(harga), notes: notes, historyLog: updatedHistory } : r);
                        setRequests(updated);
                        localStorage.setItem('req_barang_data', JSON.stringify(updated));
                    }

                    if (selectedRequest && selectedRequest.id === requestId) {
                        setSelectedRequest(prev => ({ ...prev, harga: Number(harga), notes: notes, historyLog: updatedHistory }));
                    }
                    showBannerNotification("Rincian pengadaan berhasil diperbarui!");
                } catch (e) {
                    alert("Gagal update detail finansial.");
                }
            };

            // Hapus Data Pengajuan
            const handleDeleteRequest = async (requestId) => {
                if (!confirm("Apakah Anda yakin ingin menghapus permintaan ini?")) return;

                try {
                    if (db) {
                        await deleteDoc(doc(db, 'requests', requestId));
                    } else {
                        const updated = requests.filter(r => r.id !== requestId);
                        setRequests(updated);
                        localStorage.setItem('req_barang_data', JSON.stringify(updated));
                    }
                    setIsDetailModalOpen(false);
                    showBannerNotification("Permintaan berhasil dihapus.");
                } catch (e) {
                    alert("Gagal menghapus data.");
                }
            };

            // Mengirim Pesan WhatsApp Template Otomatis
            const sendWhatsAppMessage = (req) => {
                const cleanPhone = req.whatsapp.startsWith('0') ? '62' + req.whatsapp.slice(1) : req.whatsapp;
                const message = `Halo *${req.pemohon}* (PIC ${req.divisi} ${req.cabang}),\n\n` +
                                `Terkait permintaan barang berikut:\n` +
                                `• *Nama Barang:* ${req.namaBarang}\n` +
                                `• *Kategori:* ${req.kategori}\n` +
                                `• *Jumlah:* ${req.qty} Unit\n` +
                                `• *Estimasi Harga:* Rp ${req.harga ? req.harga.toLocaleString('id-ID') : 'Belum diinput'}\n` +
                                `• *Status Pengajuan:* _${req.status}_\n\n` +
                                `Terima kasih!`;
                window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
            };

            // --- FILTERING DATA DI CLIENT SIDE ---
            const filteredRequests = requests.filter(req => {
                const searchStr = `${req.namaBarang} ${req.pemohon} ${req.cabang} ${req.divisi}`.toLowerCase();
                const matchesSearch = searchStr.includes(searchTerm.toLowerCase());
                const matchesStatus = statusFilter === 'All' || req.status === statusFilter;
                const matchesCategory = categoryFilter === 'All' || req.kategori === categoryFilter;
                return matchesSearch && matchesStatus && matchesCategory;
            });

            // --- HITUNG STATISTIK UNTUK DASHBOARD ---
            const stats = {
                total: filteredRequests.length,
                pending: filteredRequests.filter(r => r.status === 'Pending').length,
                approved: filteredRequests.filter(r => r.status === 'Approved').length,
                completed: filteredRequests.filter(r => r.status === 'Completed').length,
                budget: filteredRequests.reduce((sum, r) => sum + ((r.harga || 0) * (r.qty || 1)), 0)
            };

            return (
                <div className={darkMode ? 'dark' : ''}>
                    <div className="min-h-screen bg-slate-50 text-slate-900 transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100 pb-20">
                        
                        {/* Banner Notifikasi Floating */}
                        {notification && (
                            <div className="fixed top-4 right-4 z-50 bg-emerald-600 text-white px-5 py-3 rounded-lg shadow-2xl flex items-center gap-2 border border-emerald-500 animate-slide-in">
                                <i className="fa-solid fa-circle-check"></i>
                                <span className="font-semibold text-sm">{notification}</span>
                            </div>
                        )}

                        {/* NAV BAR UTAMA */}
                        <header className="bg-white border-b border-slate-200 sticky top-0 z-30 dark:bg-slate-900 dark:border-slate-800">
                            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="bg-gradient-to-tr from-indigo-500 to-indigo-700 text-white p-2 rounded-xl">
                                        <i className="fa-solid fa-boxes-packing text-lg"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-extrabold tracking-tight">ReqBarang</h1>
                                        <p className="text-[10px] text-slate-400 font-medium">Sistem Permintaan Barang Internal</p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-4">
                                    {/* Tombol Dark Mode Toggle */}
                                    <button 
                                        onClick={() => setDarkMode(!darkMode)}
                                        className="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white"
                                    >
                                        <i className={`fa-solid ${darkMode ? 'fa-sun' : 'fa-moon'} text-lg`}></i>
                                    </button>

                                    {/* SIMULATOR ROLE (Ganti-Ganti Wewenang Akun) */}
                                    <div className="hidden lg:flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border dark:border-slate-700">
                                        <span className="text-xs text-slate-400 px-2 font-semibold">Uji Role:</span>
                                        {Object.keys(ROLES).map(k => (
                                            <button
                                                key={k}
                                                onClick={() => {
                                                    setCurrentRole(ROLES[k].id);
                                                    showBannerNotification(`Beralih simulasi akun ke: ${ROLES[k].name}`);
                                                }}
                                                className={`text-xs px-3 py-1.5 rounded-md font-bold transition-all ${currentRole === ROLES[k].id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:text-slate-900 dark:text-slate-300'}`}
                                            >
                                                {ROLES[k].name.split(' ')[0]}
                                            </button>
                                        ))}
                                    </div>

                                    {/* User Profil Pojok */}
                                    <div className="flex items-center gap-2 border-l pl-4 border-slate-200 dark:border-slate-700">
                                        <div className="text-right">
                                            <p className="text-xs font-bold">{userProfile.name}</p>
                                            <span className="text-[9px] bg-indigo-100 text-indigo-800 dark:bg-indigo-900/50 dark:text-indigo-300 px-2 py-0.5 rounded-full font-extrabold uppercase">
                                                {currentRole}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* MAIN CONTAINER */}
                        <main className="max-w-7xl mx-auto px-4 py-8">
                            
                            {/* HERO BANNER & PROFIL CUSTOMIZER */}
                            <div className="bg-gradient-to-r from-indigo-600 to-indigo-800 text-white rounded-2xl p-6 shadow-xl mb-8 relative overflow-hidden">
                                <div className="absolute right-0 top-0 translate-x-10 -translate-y-10 opacity-10">
                                    <i className="fa-solid fa-file-invoice-dollar text-[18rem]"></i>
                                </div>
                                <div className="relative z-10 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                                    <div>
                                        <h2 className="text-2xl font-extrabold mb-1">Portal Pengadaan Internal</h2>
                                        <p className="text-indigo-100 text-sm max-w-lg mb-4">Ajukan kebutuhan perlengkapan operasional secara real-time. Status disetujui, pembelian, dan harga terpantau transparan.</p>
                                        
                                        {/* Editor Profil Pengguna */}
                                        <div className="flex flex-wrap items-center gap-2 bg-black/20 p-2 rounded-xl text-xs max-w-xl">
                                            <span className="font-bold"><i className="fa-solid fa-id-card mr-1"></i> Data Anda:</span>
                                            <input type="text" name="name" value={userProfile.name} onChange={handleProfileChange} className="bg-white dark:bg-slate-800 text-slate-800 dark:text-white px-2 py-1 rounded w-28 text-xs border-none outline-none focus:ring-1 focus:ring-indigo-500" placeholder="Nama PIC" />
                                            <input type="text" name="cabang" value={userProfile.cabang} onChange={handleProfileChange} className="bg-white dark:bg-slate-800 text-slate-800 dark:text-white px-2 py-1 rounded w-28 text-xs border-none outline-none focus:ring-1 focus:ring-indigo-500" placeholder="Cabang" />
                                            <input type="text" name="whatsapp" value={userProfile.whatsapp} onChange={handleProfileChange} className="bg-white dark:bg-slate-800 text-slate-800 dark:text-white px-2 py-1 rounded w-32 text-xs border-none outline-none focus:ring-1 focus:ring-indigo-500" placeholder="No WhatsApp" />
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={() => {
                                            setFormData({
                                                tglTerakhirPembelian: '',
                                                cabang: userProfile.cabang,
                                                pemohon: userProfile.name,
                                                divisi: userProfile.divisi,
                                                kategori: 'IT/Elektronik',
                                                namaBarang: '',
                                                qty: 1,
                                                alasanUrgensi: 'Normal',
                                                media: 'Tokopedia',
                                                notes: '',
                                                whatsapp: userProfile.whatsapp,
                                                harga: 0
                                            });
                                            setIsModalOpen(true);
                                        }}
                                        className="bg-white text-indigo-700 hover:bg-slate-100 px-6 py-3 rounded-xl font-extrabold flex items-center gap-2 shadow-lg transition active:scale-95"
                                    >
                                        <i className="fa-solid fa-plus"></i> Buat Permintaan Baru
                                    </button>
                                </div>
                            </div>

                            {/* RINGKASAN DASHBOARD STATISTIK */}
                            <div className="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                                <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border dark:border-slate-800 flex justify-between items-center">
                                    <div>
                                        <p className="text-[10px] uppercase font-bold text-slate-400">Total Pengajuan</p>
                                        <p className="text-2xl font-black">{stats.total}</p>
                                    </div>
                                    <i className="fa-solid fa-folder-open text-2xl text-indigo-500 opacity-60"></i>
                                </div>
                                <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border dark:border-slate-800 flex justify-between items-center">
                                    <div>
                                        <p className="text-[10px] uppercase font-bold text-slate-400">Menunggu</p>
                                        <p className="text-2xl font-black text-amber-500">{stats.pending}</p>
                                    </div>
                                    <i className="fa-solid fa-clock-rotate-left text-2xl text-amber-500 opacity-60 animate-pulse"></i>
                                </div>
                                <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border dark:border-slate-800 flex justify-between items-center">
                                    <div>
                                        <p className="text-[10px] uppercase font-bold text-slate-400">Disetujui</p>
                                        <p className="text-2xl font-black text-emerald-500">{stats.approved}</p>
                                    </div>
                                    <i className="fa-solid fa-circle-check text-2xl text-emerald-500 opacity-60"></i>
                                </div>
                                <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border dark:border-slate-800 flex justify-between items-center">
                                    <div>
                                        <p className="text-[10px] uppercase font-bold text-slate-400">Selesai Dibeli</p>
                                        <p className="text-2xl font-black text-sky-500">{stats.completed}</p>
                                    </div>
                                    <i className="fa-solid fa-truck-ramp-box text-2xl text-sky-500 opacity-60"></i>
                                </div>
                                <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border dark:border-slate-800 col-span-2 lg:col-span-1 flex justify-between items-center">
                                    <div>
                                        <p className="text-[10px] uppercase font-bold text-slate-400">Total Anggaran</p>
                                        <p className="text-md font-extrabold text-indigo-600 dark:text-indigo-400">Rp {stats.budget.toLocaleString('id-ID')}</p>
                                    </div>
                                    <i className="fa-solid fa-wallet text-2xl text-indigo-500 opacity-60"></i>
                                </div>
                            </div>

                            {/* AREA FILTER DAN PENCARIAN */}
                            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border dark:border-slate-800 mb-8 flex flex-col md:flex-row justify-between gap-4">
                                <div className="relative flex-1">
                                    <i className="fa-solid fa-magnifying-glass text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                                    <input 
                                        type="text"
